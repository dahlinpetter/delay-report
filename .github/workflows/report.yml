name: Weekly delay email
on:
  schedule:
    # Fridays 16:30 UTC (18:30 summer / 17:30 winter Swedish time)
    - cron: "30 16 * * 5"
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back"
        default: "7"
permissions:
  contents: write
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and email reports
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: python report.py --days "${{ github.event.inputs.days || 7 }}"
      - name: Keep a copy of the reports
        run: |
          git config user.name "delay-bot"
          git config user.email "delay-bot@users.noreply.github.com"
          git add reports
          git diff --cached --quiet || git commit -m "reports: $(date -u +%F)"
          git pull --rebase -q && git push -q || true
